<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>DSA Notes</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup-container">
            <h1 class="popup-title">DSA Notes</h1>
            <p class="popup-count" id="note-count">Loading...</p>
            <button id="export-btn-md" class="popup-export-btn">Export to Md</button>
            <button id="export-btn-json" class="popup-export-btn">Export to JSON</button>
            <button id="import-btn" class="popup-import-btn">Import JSON to DB</button>
            <input type="file" id="import-file-input" accept=".json" style="display: none;" />
        </div>
        <script type="module" src="popup.js"></script>
    </body>
</html>
