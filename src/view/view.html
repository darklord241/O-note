<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA notes</title>
    <link rel="stylesheet" href="view.css">
</head>
<body>
    <main class="view-container">
        <header class="view-header">
            <div>
                <h1>DSA Notes</h1>
                <p id="note-count">Loading notes...</p>
            </div>
        </header>
           <section class="filters">
                <input type="text" id="search-input" placeholder="Search notes...">
                <select id="site-filter">
                    <option value="all">All Sites</option>
                    <option value="leetcode">LeetCode</option>
                    <option value="codeforces">Codeforces</option>
                </select>
                <select id="label-filter">
                    <option value="all">All Labels</option>
                </select>
                <select id="sort-filter">
                    <option value="updated-desc">Recently Updated</option>
                    <option value="updated-asc">Oldest Updated</option>
                    <option value="question-asc">Question A-Z</option>
                    <option value="question-desc">Question Z-A</option>
                </select>
            </section>
        <section id="notes-container" class="notes-container">
            <!-- note cards inserted by view.js -->
        </section>
    </main>
    <script type="module" src="view.js"></script>
</body>
</html>
