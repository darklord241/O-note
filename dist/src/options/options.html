<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>O(note)</title>
      <script type="module" crossorigin src="/assets/options.html-CXdbi8NF.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
      <link rel="modulepreload" crossorigin href="/assets/settings-DZkbCkLq.js">
      <link rel="stylesheet" crossorigin href="/assets/options-B5kjbVqm.css">
    </head>
    <body>
        <fieldset>
            <legend>Label</legend>
            <label><input type="checkbox" data-path="labelInput.enabled">Enable Label</label>
            <label class="sub-option">
                <input type="checkbox" data-path="labelInput.toggleInput" data-depends-on="labelInput.enabled">
                Enable toggle label input button
            </label>
        </fieldset>
        <fieldset>
            <legend>Markdown Support</legend>
            <label><input type="checkbox" data-path="mdRender.enabled">Enable Markdown</label>
            <label class="sub-option">
                <input type="checkbox" data-path="mdRender.toggleModeShortcut" data-depends-on="mdRender.enabled">
                Enable toggle mode shortcut (Alt+K)
            </label>
            <label class="sub-option">
                <input type="checkbox" data-path="mdRender.autoRenderOnPause" data-depends-on="mdRender.enabled">
                Autorender after 2 s of no activity in panel
            </label>
        </fieldset>
        <fieldset>    
            <legend>Panel Toggling Shortcut</legend>
            <label><input type="checkbox" data-path="togglePanelShortcut">Enable (Alt+L)</label>
        </fieldset>
        <fieldset>
            <legend>Export </legend>
            <label><input type="checkbox" data-path="export">Enable</label>
        </fieldset>
        <fieldset>
            <legend>Site</legend>
            <label class="sub-option"><input type="checkbox" data-path="sites.codeforces">Codeforces</input></label>
            <label class="sub-option"><input type="checkbox" data-path="sites.leetcode">Leetcode</input></label>
        </fieldset>
    </body>
</html>
